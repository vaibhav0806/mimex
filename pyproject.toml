[project]
name = "mimex"
version = "0.1.0"
description = "Reproducible experiments in open-source AI text detection."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "huggingface-hub>=0.28,<3",
    "ijson>=3.4,<4",
    "torch>=2.6,<3",
    "transformers>=4.48,<6",
]

[project.scripts]
mimex = "mimex.cli:main"

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 88
